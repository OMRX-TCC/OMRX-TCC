<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senha atualizada | OMRX</title>

    <link rel="icon" type="image/png" href="../assets/images/logo-omrx.png" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
  </head>
  <body>
    <main class="auth-page auth-page--notice">
      <section
        class="auth-card auth-card--notice auth-card--recovery"
        aria-labelledby="senha-atualizada-titulo"
      >
        <div class="auth-card__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M23.333 7L10.5 19.833L4.667 14" />
          </svg>
        </div>

        <div class="auth-card__head">
          <h1 id="senha-atualizada-titulo" class="auth-card__title">Senha atualizada!</h1>

          <p class="auth-card__text">
            Sua senha foi atualizada, agora você poderá realizar o login.
          </p>
        </div>

        <a class="button-primary" href="./login.html">Ir para o login</a>
      </section>
    </main>
  </body>
</html>
