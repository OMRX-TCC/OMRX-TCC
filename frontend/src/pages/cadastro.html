<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | OMRX</title>

    <link rel="icon" type="image/png" href="../assets/images/logo-omrx.png" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/components/header.css" />
    <link rel="stylesheet" href="../styles/components/footer.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <script type="module" src="../scripts/components/omrx-header.js"></script>
    <script type="module" src="../scripts/components/omrx-footer.js"></script>
    <script type="module" src="../scripts/pages/cadastro.js"></script>
  </head>
  <body>
    <omrx-header no-actions></omrx-header>

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="cadastro-titulo">
        <h1 id="cadastro-titulo" class="auth-card__title">Crie sua conta grátis</h1>

        <form id="cadastro-form" class="auth-form" novalidate>
          <div class="auth-form__fields">
            <div class="form-field">
              <label class="form-field__label" for="name">Nome</label>
              <input
                class="form-field__input"
                id="name"
                name="name"
                type="text"
                placeholder="Seu nome completo"
                autocomplete="name"
                aria-describedby="name-error"
                required
              />
              <p class="form-field__error" id="name-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="email">E-mail</label>
              <input
                class="form-field__input"
                id="email"
                name="email"
                type="email"
                placeholder="voce@email.com"
                autocomplete="email"
                aria-describedby="email-error"
                required
              />
              <p class="form-field__error" id="email-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="password">Senha</label>
              <input
                class="form-field__input"
                id="password"
                name="password"
                type="password"
                placeholder="Crie uma senha forte"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="password-error"
                required
              />
              <p class="form-field__error" id="password-error" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="repeatPassword">Confirmar senha</label>
              <input
                class="form-field__input"
                id="repeatPassword"
                name="repeatPassword"
                type="password"
                placeholder="Confirme a senha"
                autocomplete="new-password"
                aria-describedby="repeatPassword-error"
                required
              />
              <p class="form-field__error" id="repeatPassword-error" aria-live="polite"></p>
            </div>
          </div>

          <p class="form-status" id="form-status" role="status"></p>

          <button class="button-primary" type="submit">Criar conta</button>
        </form>

        <div class="auth-divider" role="separator">
          <span class="auth-divider__text">ou</span>
        </div>

        <p class="auth-switch">
          <span>Já tem uma conta?</span>
          <a class="auth-switch__link" href="./login.html">Entrar</a>
        </p>
      </section>
    </main>

    <omrx-footer></omrx-footer>
  </body>
</html>
