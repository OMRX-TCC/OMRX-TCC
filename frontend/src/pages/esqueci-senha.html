<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha | OMRX</title>

    <link rel="icon" type="image/png" href="../assets/images/logo-omrx.png" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/components/header.css" />
    <link rel="stylesheet" href="../styles/components/footer.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <script type="module" src="../scripts/components/omrx-header.js"></script>
    <script type="module" src="../scripts/components/omrx-footer.js"></script>
    <script type="module" src="../scripts/pages/esqueci-senha.js"></script>
  </head>
  <body>
    <omrx-header no-actions></omrx-header>

    <main class="auth-page auth-page--notice">
      <section
        class="auth-card auth-card--notice auth-card--recovery"
        aria-labelledby="esqueci-senha-titulo"
      >
        <div class="auth-card__head">
          <h1 id="esqueci-senha-titulo" class="auth-card__title">Esqueceu sua senha?</h1>

          <p class="auth-card__text">
            Digite o e-mail da sua conta e enviaremos um link para você criar uma nova senha.
          </p>
        </div>

        <form id="forgot-password-form" class="auth-form" novalidate>
          <div class="auth-form__fields">
            <div class="form-field">
              <label class="form-field__label" for="email">E-mail</label>
              <input
                class="form-field__input"
                id="email"
                name="email"
                type="email"
                placeholder="voce@email.com"
                autocomplete="email"
                aria-describedby="email-error"
                required
              />
              <p class="form-field__error" id="email-error" aria-live="polite"></p>
            </div>
          </div>

          <p class="form-status" id="form-status" role="status"></p>

          <button class="button-primary" type="submit">Enviar link</button>
        </form>

        <p class="auth-switch">
          <span>Lembrou a senha?</span>
          <a class="auth-switch__link" href="./login.html">Entrar</a>
        </p>
      </section>
    </main>

    <omrx-footer></omrx-footer>
  </body>
</html>
