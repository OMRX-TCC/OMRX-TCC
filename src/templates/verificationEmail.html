<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin:0;padding:0;background-color:#272f6a;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
            style="max-width:440px;background-color:#1a2050;border:1.5px solid #3a4490;border-radius:20px;padding:40px;">
            <tr>
              <td style="color:#b9e4f6;font-size:22px;font-weight:bold;letter-spacing:1px;padding-bottom:24px;">
                OMRX
              </td>
            </tr>
            <tr>
              <td style="color:#f4f4f4;font-size:24px;font-weight:bold;padding-bottom:12px;">
                Confirme seu e-mail
              </td>
            </tr>
            <tr>
              <td style="color:#c8c9d6;font-size:15px;line-height:22px;padding-bottom:28px;">
                Ola, {{name}}! Clique no botao abaixo para ativar sua conta.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <a href="{{verifyUrl}}"
                  style="display:block;background-color:#ee5a3c;color:#000000;font-size:15px;font-weight:bold;text-decoration:none;padding:14px 24px;border-radius:10px;">
                  Confirmar e-mail
                </a>
              </td>
            </tr>
            <tr>
              <td style="color:#9aa0c4;font-size:13px;line-height:20px;">
                O link expira em {{expiresInHours}} horas. Se voce nao criou uma conta no OMRX, ignore este e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
